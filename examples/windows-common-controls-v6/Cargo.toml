[package]
name = "windows-common-controls-v6"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["libxdo", "gtk3", "appkit", "win32"]
libxdo = ["muda/libxdo"]
gtk3 = ["muda/gtk3"]
appkit = ["muda/appkit"]
win32 = ["muda/win32"]

[dependencies]
muda = { path = "../../", default-features = false, features = ["common-controls-v6"] }
tao = "0.28"
image = "0.25"

[target."cfg(target_os = \"windows\")".dependencies.windows-sys]
version = "0.59"
features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"]

[build-dependencies]
embed-resource = "2"
