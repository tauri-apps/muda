[package]
name = "muda"
version = "0.17.1"
description = "Menu Utilities for Desktop Applications"
edition = "2021"
keywords = ["windowing", "menu"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/amrbashir/muda"
documentation = "https://docs.rs/muda"
categories = ["gui"]
rust-version = "1.83"

[features]
default = []
common-controls-v6 = []
serde = ["dep:serde", "dpi/serde"]
# ksni support for tray-icon on Linux (GTK-agnostic DBus tray)
linux-ksni = ["dep:arc-swap"]
# No-op for GTK4 - libxdo is X11-only, GTK4 is Wayland-focused
libxdo = []
# No-op - GTK4 is always used on Linux, this exists for API compatibility
gtk = []

[dependencies]
crossbeam-channel = "0.5"
keyboard-types = "0.7"
once_cell = "1"
thiserror = "2"
serde = { version = "1", optional = true }
dpi = "0.1"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_Globalization",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemServices",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls",
]

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = "0.10"
png = "0.17"
arc-swap = { version = "1.7.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.0"
objc2-core-foundation = { version = "0.3.0", default-features = false, features = [
  "std",
  "CFCGTypes",
] }
objc2-foundation = { version = "0.3.0", default-features = false, features = [
  "std",
  "NSAttributedString",
  "NSData",
  "NSDictionary",
  "NSGeometry",
  "NSString",
  "NSThread",
] }
objc2-app-kit = { version = "0.3.0", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSApplication",
  "NSCell",
  "NSEvent",
  "NSImage",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSRunningApplication",
  "NSView",
  "NSWindow",
] }
png = "0.17"

[dev-dependencies]
winit = "0.30"
tao = "0.30"
wry = "0.45"
image = "0.25"
