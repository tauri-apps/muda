[package]
name = "muda"
version = "0.21.2"
description = "Menu Utilities for Desktop Applications"
edition = "2021"
keywords = ["windowing", "menu"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/tauri-apps/muda"
documentation = "https://docs.rs/muda"
categories = ["gui"]
rust-version = "1.90"
include = [
  "README.md",
  "build.rs",
  "src/**/*.rs",
  "Cargo.toml",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "LICENSE.spdx",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["gtk3"]
gtk3 = ["dep:gtk", "dep:libc"]
gtk4 = ["dep:gtk4", "dep:libc"]
common-controls-v6 = []
snapshot = []
# Qt Widgets backend (Linux/BSD), built on the `qtshim` crate; `gtk3`/`gtk4` take precedence over it.
qt = ["dep:qtshim"]
serde = ["dep:serde", "dpi/serde", "keyboard-types/serde"]

[dependencies]
crossbeam-channel = "0.5"
keyboard-types = "0.8"
thiserror = "2"
serde = { version = "1", optional = true }
dpi = "0.1"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = ">=0.60, <=0.61"
features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_Globalization",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemServices",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls",
]

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
qtshim = { version = "0.1", git = "https://github.com/KRTirtho/tauri", branch = "qt-support", optional = true }
gtk = { version = "0.18", optional = true }
gtk4 = { version = "0.11", optional = true, features = ["v4_12"] }
# Only to resolve WebKitGTK's editing commands at runtime; see `platform_impl::gtk_common::webkit`.
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.1"
objc2-core-foundation = { version = "0.3.0", default-features = false, features = [
  "std",
  "CFCGTypes",
] }
objc2-foundation = { version = "0.3.0", default-features = false, features = [
  "std",
  "NSAttributedString",
  "NSData",
  "NSDictionary",
  "NSGeometry",
  "NSString",
  "NSThread",
] }
objc2-app-kit = { version = "0.3.0", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSApplication",
  "NSAttributedString",
  "NSCell",
  "NSEvent",
  "NSImage",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  "NSView",
  "NSWindow",
] }
png = "0.18"

[dev-dependencies]
winit = "0.30"
tao = "0.37"
wry = "0.57"
image = { version = "0.25", default-features = false, features = ["png"] }

# GTK 4 is only needed by the `winit_gtk4` example; the Qt tests (`--cfg muda_qt_tests`) build
# without it, so they don't need the GTK 4 dev packages.
[target.'cfg(not(muda_qt_tests))'.dev-dependencies]
winit-gtk4 = { package = "winit", git = "https://github.com/tauri-apps/winit-gtk4", default-features = false, features = [
  "gtk4",
] }

# Only for the Qt tests, so other backends' tests don't need Qt: `tests/qt.rs`.
[target.'cfg(muda_qt_tests)'.dev-dependencies]
qtshim = { git = "https://github.com/KRTirtho/tauri", branch = "qt-support", features = ["webengine", "test-harness"] }

[[example]]
name = "winit_gtk4"
required-features = ["gtk4"]

# Real Qt tests of the `qt` backend, one process per case (see `qtshim::test_harness`):
# `RUSTFLAGS="--cfg muda_qt_tests" cargo test --no-default-features --features qt --test qt`
[[test]]
name = "qt"
path = "tests/qt.rs"
harness = false
required-features = ["qt"]
