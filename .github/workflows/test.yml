name: test

on:
  push:
    branches:
      - dev
  pull_request:

env:
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            cargo-args: --features snapshot
          - platform: macos-latest
            cargo-args: --features snapshot
          - platform: ubuntu-latest
            backend: (gtk3)
            cargo-args: --features snapshot
          - platform: ubuntu-latest
            backend: (gtk4)
            cargo-args: --no-default-features --features gtk4,snapshot

    runs-on: ${{ matrix.platform }}

    name: test ${{ matrix.platform }} ${{ matrix.backend }}

    steps:
      - uses: actions/checkout@v7

      - name: install system deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgtk-4-dev libxdo-dev libwebkit2gtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: dtolnay/rust-toolchain@1.90
        if: matrix.platform != 'ubuntu-latest'
      - uses: dtolnay/rust-toolchain@1.92
        if: matrix.platform == 'ubuntu-latest'

      - run: cargo build ${{ matrix.cargo-args }}

      - name: Build common-controls-v6 example
        if: matrix.platform == 'windows-latest'
        run: cargo build --manifest-path examples/windows-common-controls-v6/Cargo.toml --no-default-features

      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test ${{ matrix.cargo-args }}


      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo +nightly miri test ${{ matrix.cargo-args }}
